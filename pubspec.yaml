name: lift_load
description: "Lift Load: a hybrid-casual lift puzzle. Guess who fits, fill the lift, never overload it."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  # M3 adds: google_mobile_ads, in_app_purchase, firebase_core, firebase_analytics

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # SIL Open Font License: assets/fonts/OFL-*.txt
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-600.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-800.ttf
          weight: 800
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-600.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-700.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans-800.ttf
          weight: 800
